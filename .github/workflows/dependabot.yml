name: Dependabot

on:
  pull_request

permissions:
  contents: read

concurrency:
  group: dependabot-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  auto-approve:
    # Only Dependabot pull requests in this repository: never forks or
    # human-authored PRs get an auto-approval or auto-merge.
    if: >-
      github.event.pull_request.user.login == 'dependabot[bot]' &&
      github.repository == 'ckir/aiCliBench'
    runs-on: ubuntu-latest
    permissions:
      contents: write # gh pr merge
      pull-requests: write # gh pr review --approve
    steps:
      - name: Approve and enable auto-merge
        run: |
          gh pr review --approve "$PR_URL"
          gh pr merge --auto --squash "$PR_URL"
        env:
          PR_URL: ${{ github.event.pull_request.html_url }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
