name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7 # Pin to full SHA in production.

      - name: Install uv
        uses: astral-sh/setup-uv@v7 # Pin to full SHA in production.
        with:
          enable-cache: true

      - name: Set up Python
        run: uv python install 3.13

      - name: Sync locked environment
        run: uv sync --locked

      - name: Ruff
        run: uv run ruff check .

      - name: Formatting
        run: uv run ruff format --check .

      - name: Type check
        run: uv run ty check

      - name: Tests
        run: uv run pytest

      - name: Build all packages
        run: uv build --all-packages
