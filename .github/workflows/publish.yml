name: Publish Python Packages

on:
  release:
    types: [published]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6 # Pin to full SHA in production.

      - name: Install uv
        uses: astral-sh/setup-uv@v7 # Pin to full SHA in production.
        with:
          enable-cache: true

      - name: Set up Python
        run: uv python install 3.13

      - name: Sync
        run: uv sync --locked

      - name: Build distributions
        run: uv build --all-packages

      - name: Upload distributions
        uses: actions/upload-artifact@v5 # Pin to full SHA in production.
        with:
          name: distributions
          path: dist/

  publish:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      id-token: write
      contents: read
    steps:
      - name: Download distributions
        uses: actions/download-artifact@v6 # Pin to full SHA in production.
        with:
          name: distributions
          path: dist/

      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1 # Pin to full SHA in production.
