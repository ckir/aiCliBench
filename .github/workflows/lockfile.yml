name: Lockfile

on:
  pull_request:
    types: [opened, synchronize, reopened]

permissions:
  contents: read

concurrency:
  group: lockfile-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  refresh:
    # Only trusted, same-repo release-please branches: version bumps there
    # invalidate uv.lock, which would break `uv sync --locked` on main once
    # the release PR merges. Never run this write-capable job on forks or
    # arbitrary pull requests.
    if: >-
      github.event.pull_request.head.repo.full_name == github.repository &&
      startsWith(github.head_ref, 'release-please--branches--main--components--')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7 # Pin to full SHA in production.
        with:
          ref: ${{ github.head_ref }}

      - name: Install uv
        uses: astral-sh/setup-uv@v7 # Pin to full SHA in production.
        with:
          enable-cache: true

      - name: Set up Python
        run: uv python install 3.13

      - name: Regenerate lockfile
        run: uv lock

      - name: Commit updated lockfile
        run: |
          if git diff --quiet uv.lock; then
            echo "uv.lock already up to date."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add uv.lock
          git commit -m "chore: refresh uv.lock for release version bumps"
          git push
