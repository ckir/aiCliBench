[project]
name = "ai-mcp-client"
version = "0.2.0"
description = "MCP client abstractions"
requires-python = ">=3.12"
dependencies = [
  "ai-mcp-core",
  "ai-core",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/ai_mcp_client"]

[tool.uv.sources]
ai-mcp-core = { workspace = true }
ai-core = { workspace = true }
