[project]
name = "ai-runtime"
version = "0.2.0"
description = "Provider-independent AI model abstractions"
requires-python = ">=3.12"
dependencies = [
  "ai-core",
  "ai-schemas",
  "pydantic>=2.14.1",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/ai_runtime"]

[tool.uv.sources]
ai-core = { workspace = true }
ai-schemas = { workspace = true }
