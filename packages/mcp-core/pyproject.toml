[project]
name = "ai-mcp-core"
version = "0.2.0"
description = "MCP-neutral capability contracts"
requires-python = ">=3.12"
dependencies = [
  "ai-core",
  "ai-schemas",
  "ai-plugins-sdk",
  "pydantic>=2",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/ai_mcp_core"]

[tool.uv.sources]
ai-core = { workspace = true }
ai-schemas = { workspace = true }
ai-plugins-sdk = { workspace = true }
