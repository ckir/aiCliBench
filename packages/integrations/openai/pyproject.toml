[project]
name = "ai-integration-openai"
version = "0.1.0"
description = "OpenAI provider adapter"
requires-python = ">=3.12"
dependencies = [
  "ai-runtime",
  "ai-core",
  "ai-schemas",
  "httpx>=0.27",
  "pydantic>=2",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/ai_integration_openai"]

[tool.uv.sources]
ai-runtime = { workspace = true }
ai-core = { workspace = true }
ai-schemas = { workspace = true }
