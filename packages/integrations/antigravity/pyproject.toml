[project]
name = "ai-integration-antigravity"
version = "0.1.0"
description = "Google Antigravity CLI (agy) adapter (subprocess, no provider SDK leakage)"
requires-python = ">=3.12"
dependencies = [
  "ai-core",
  "ai-schemas",
  "ai-agents",
  "pydantic>=2",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/ai_integration_antigravity"]

[tool.uv.sources]
ai-core = { workspace = true }
ai-schemas = { workspace = true }
ai-agents = { workspace = true }
