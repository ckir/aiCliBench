[project]
name = "ai-mcp-testing"
version = "0.2.0"
description = "Testing utilities for MCP capabilities"
requires-python = ">=3.12"
dependencies = [
  "pytest>=9.2.0",
  "ai-mcp-core",
  "ai-core",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/ai_mcp_testing"]

[tool.uv.sources]
ai-mcp-core = { workspace = true }
ai-core = { workspace = true }
