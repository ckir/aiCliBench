[project]
name = "ai-schemas"
version = "0.1.0"
description = "Shared Pydantic schemas"
requires-python = ">=3.12"
dependencies = [
  "pydantic>=2.14.1",
  "ai-core",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/ai_schemas"]

[tool.uv.sources]
ai-core = { workspace = true }
