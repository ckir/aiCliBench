[project]
name = "ai-cli"
version = "0.1.0"
description = "Developer/operator CLI"
requires-python = ">=3.12"
dependencies = [
  "ai-plugins-sdk",
  "ai-plugin-example",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/ai_cli"]

[tool.uv.sources]
ai-plugins-sdk = { workspace = true }
ai-plugin-example = { workspace = true }

[project.scripts]
ai = "ai_cli:main"
