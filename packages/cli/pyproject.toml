[project]
name = "ai-cli"
version = "0.1.0"
description = "Developer/operator CLI"
requires-python = ">=3.12"
dependencies = [
  "ai-plugins-sdk",
  "ai-plugin-example",
  "ai-core",
  "ai-schemas",
  "ai-agents",
  "ai-benchmark",
  "ai-integration-claude-code",
  "ai-integration-antigravity",
  "ai-integration-generic-cli",
  "pydantic>=2",
  "typer>=0.9",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/ai_cli"]

[tool.uv.sources]
ai-plugins-sdk = { workspace = true }
ai-plugin-example = { workspace = true }
ai-core = { workspace = true }
ai-schemas = { workspace = true }
ai-agents = { workspace = true }
ai-benchmark = { workspace = true }
ai-integration-claude-code = { workspace = true }
ai-integration-antigravity = { workspace = true }
ai-integration-generic-cli = { workspace = true }

[project.scripts]
ai = "ai_cli:main"
codebench = "ai_cli.codebench:app"
