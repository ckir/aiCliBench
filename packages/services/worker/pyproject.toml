[project]
name = "ai-service-worker"
version = "0.1.0"
description = "AI background worker"
requires-python = ">=3.12"
dependencies = [
  "ai-agents",
  "ai-core",
  "ai-runtime",
  "ai-plugin-example",
  "pydantic>=2",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/ai_service_worker"]

[tool.uv.sources]
ai-agents = { workspace = true }
ai-core = { workspace = true }
ai-runtime = { workspace = true }
ai-plugin-example = { workspace = true }
