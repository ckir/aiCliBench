[project]
name = "ai-service-api"
version = "0.1.0"
description = "AI HTTP service"
requires-python = ">=3.12"
dependencies = [
  "ai-agents",
  "ai-core",
  "ai-plugins-sdk",
  "ai-plugin-example",
  "ai-mcp-server",
  "pydantic>=2",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/ai_service_api"]

[tool.uv.sources]
ai-agents = { workspace = true }
ai-core = { workspace = true }
ai-plugins-sdk = { workspace = true }
ai-plugin-example = { workspace = true }
ai-mcp-server = { workspace = true }
