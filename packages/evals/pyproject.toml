[project]
name = "ai-evals"
version = "0.2.0"
description = "AI evaluation framework"
requires-python = ">=3.12"
dependencies = [
  "pytest>=8",
  "ai-runtime",
  "ai-schemas",
  "ai-core",
  "ai-agents",
  "ai-plugins-sdk",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/ai_evals"]

[tool.uv.sources]
ai-runtime = { workspace = true }
ai-schemas = { workspace = true }
ai-core = { workspace = true }
ai-agents = { workspace = true }
ai-plugins-sdk = { workspace = true }
