[project]
name = "ai-mcp-server"
version = "0.2.0"
description = "Reusable MCP server adapter"
requires-python = ">=3.12"
dependencies = [
  "ai-mcp-core",
  "ai-plugins-sdk",
  "ai-core",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/ai_mcp_server"]

[tool.uv.sources]
ai-mcp-core = { workspace = true }
ai-plugins-sdk = { workspace = true }
ai-core = { workspace = true }
