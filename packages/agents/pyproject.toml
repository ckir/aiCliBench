[project]
name = "ai-agents"
version = "0.1.0"
description = "Agent orchestration runtime"
requires-python = ">=3.12"
dependencies = [
  "ai-runtime",
  "ai-core",
  "ai-schemas",
  "ai-plugins-sdk",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/ai_agents"]

[tool.uv.sources]
ai-runtime = { workspace = true }
ai-core = { workspace = true }
ai-schemas = { workspace = true }
ai-plugins-sdk = { workspace = true }
