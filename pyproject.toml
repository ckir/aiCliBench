[project]
name = "ai-monorepo"
version = "0.0.0"
description = "AI, MCP, plugin, and agent monorepo"
requires-python = ">=3.12"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE*"]
dependencies = [
  "ai-core",
  "ai-schemas",
  "ai-runtime",
  "ai-agents",
  "ai-plugins-sdk",
  "ai-plugin-example",
  "ai-integration-openai",
  "ai-integration-claude-code",
  "ai-integration-antigravity",
  "ai-integration-generic-cli",
  "ai-mcp-core",
  "ai-mcp-server",
  "ai-mcp-client",
  "ai-mcp-testing",
  "ai-evals",
  "ai-benchmark",
  "ai-cli",
  "ai-service-api",
  "ai-service-worker",
]

[tool.uv]
package = false

[tool.uv.sources]
ai-core = { workspace = true }
ai-schemas = { workspace = true }
ai-runtime = { workspace = true }
ai-agents = { workspace = true }
ai-plugins-sdk = { workspace = true }
ai-plugin-example = { workspace = true }
ai-integration-openai = { workspace = true }
ai-integration-claude-code = { workspace = true }
ai-integration-antigravity = { workspace = true }
ai-integration-generic-cli = { workspace = true }
ai-mcp-core = { workspace = true }
ai-mcp-server = { workspace = true }
ai-mcp-client = { workspace = true }
ai-mcp-testing = { workspace = true }
ai-evals = { workspace = true }
ai-benchmark = { workspace = true }
ai-cli = { workspace = true }
ai-service-api = { workspace = true }
ai-service-worker = { workspace = true }

[tool.uv.workspace]
members = [
  "packages/*",
  "packages/plugins/*",
  "packages/integrations/*",
  "packages/services/*",
]
exclude = [
  "packages/integrations",
  "packages/plugins",
  "packages/services",
]

[dependency-groups]
dev = [
  "pytest>=8",
  "pytest-cov>=5",
  "ruff>=0.8",
  "ty>=0.0.70",
  "httpx>=0.27",
  "pydantic>=2",
]

[tool.ruff]
target-version = "py312"
line-length = 100
src = [
  "packages/*/src",
  "packages/plugins/*/src",
  "packages/integrations/*/src",
  "packages/services/*/src",
]

[tool.ruff.lint]
select = [
  "E", "F", "I", "UP", "B", "SIM", "S",
  "C4", "PIE", "PT", "RET", "RUF",
]
ignore = []

[tool.ruff.lint.per-file-ignores]
"packages/*/tests/*.py" = ["S101"]
"packages/plugins/*/tests/*.py" = ["S101"]
"packages/integrations/*/tests/*.py" = ["S101"]
"packages/services/*/tests/*.py" = ["S101"]
"tasks/**" = ["S101", "S104", "S311", "PT011", "PT015", "B011", "B905", "UP046", "E501", "E731"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"

[tool.pytest.ini_options]
addopts = "-ra --import-mode=importlib"
testpaths = [
  "packages/*/tests",
  "packages/plugins/*/tests",
  "packages/integrations/*/tests",
  "packages/services/*/tests",
]
markers = [
  "integration: requires integration dependencies or external services",
  "live: requires live provider credentials/network access",
  "eval: model evaluation suite",
]
