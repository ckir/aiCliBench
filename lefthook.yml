pre-commit:
  parallel: true
  commands:
    format:
      glob: "*.py"
      run: uv run ruff format --check {staged_files}
    lint:
      glob: "*.py"
      run: uv run ruff check {staged_files}

pre-push:
  parallel: true
  commands:
    typecheck:
      run: uv run ty check
    tests:
      run: uv run pytest

commit-msg:
  commands:
    conventional-commit:
      run: 'grep -qE "^(feat|fix|docs|style|refactor|perf|test|build|ci|chore|revert)(\([A-Za-z0-9_/-]+\))?(!)?: .+" "{1}"'
